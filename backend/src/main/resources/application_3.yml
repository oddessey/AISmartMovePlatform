
server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/smartmove
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
        format_sql: true
  data:
    redis:
      host: redis
      port: 6379
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_REST_KEY}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

ai:
  server:
    url: http://ai-server:8000

jwt:
  secret: ${JWT_SECRET:uCL5p3G2N1r9XvQ8sW0aZbYdEfGhIjKlMnOpQrStUvWxYzAbCdEfGhIjKlMnOpQrStUvWxYz0123456789}
  access-exp: 3600000
  refresh-exp: 86400000

kakao:
  map:
    js-key: ${KAKAO_JS_KEY}

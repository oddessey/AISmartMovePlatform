
server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/smartmove
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
        format_sql: true
  data:
    redis:
      host: redis
      port: 6379
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 30MB

ai:
  server:
    url: http://ai-server:8000

jwt:
  secret: ${JWT_SECRET:very-long-secret-key-for-jwt-must-be-64chars-minimum-xxxxxxxxxxxx}
  access-exp: 3600000
  refresh-exp: 86400000

logging:
  level:
    com.smartmove: DEBUG
